<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#225f99"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
<rect x="30" y="30" width="500" height="88" rx="8" fill="#f4f6f9" stroke="#66758b" stroke-width="2"/>
<text x="46" y="56" font-size="14" fill="#66758b" font-weight="bold">出発点の課題</text>
<text x="46" y="82" font-size="17" fill="#22324a">大学教員の仕事は, 複数のプロジェクトが同時に</text>
<text x="46" y="106" font-size="17" fill="#22324a">進み, 1 つの対象に深く関わり続けられない</text>
<line x1="90" y1="124" x2="90" y2="184" stroke="#225f99" stroke-width="3" marker-end="url(#ah)"/>
<text x="114" y="152" font-size="15" fill="#66758b">クエスチョンバーストで問いを 15〜20 個出し,</text>
<text x="114" y="174" font-size="15" fill="#66758b">面白いと感じた問いを選ぶ</text>
<rect x="30" y="194" width="500" height="88" rx="8" fill="#eaf2fb" stroke="#225f99" stroke-width="2"/>
<text x="46" y="220" font-size="14" fill="#225f99" font-weight="bold">1 回目の問いから立てた課題</text>
<text x="46" y="246" font-size="17" fill="#22324a">企業で働くと, 複数のことに少しずつ関わる</text>
<text x="46" y="270" font-size="17" fill="#22324a">ことになりがちなのはなぜか</text>
<line x1="90" y1="288" x2="90" y2="348" stroke="#225f99" stroke-width="3" marker-end="url(#ah)"/>
<text x="114" y="316" font-size="15" fill="#66758b">クエスチョンバーストで問いを 15〜20 個出し,</text>
<text x="114" y="338" font-size="15" fill="#66758b">面白いと感じた問いを選ぶ</text>
<rect x="30" y="358" width="500" height="64" rx="8" fill="#eaf2fb" stroke="#225f99" stroke-width="2"/>
<text x="46" y="384" font-size="14" fill="#225f99" font-weight="bold">2 回目の問いから立てた課題</text>
<text x="46" y="410" font-size="17" fill="#22324a">人間が「一連の」と感じる仕事や作業とは何か</text>
<line x1="90" y1="428" x2="90" y2="488" stroke="#225f99" stroke-width="3" marker-end="url(#ah)"/>
<text x="114" y="456" font-size="15" fill="#66758b">クエスチョンバーストで問いを 15〜20 個出し,</text>
<text x="114" y="478" font-size="15" fill="#66758b">面白いと感じた問いを選ぶ</text>
<rect x="30" y="498" width="500" height="88" rx="8" fill="#fbeceb" stroke="#c8312b" stroke-width="2"/>
<text x="46" y="524" font-size="14" fill="#c8312b" font-weight="bold">3 回目の問いから立てた問い</text>
<text x="46" y="550" font-size="17" fill="#22324a">作業を処理する形式 (並列と逐次) には, それぞれ</text>
<text x="46" y="574" font-size="17" fill="#22324a">どんな特徴があり, なぜ生じ, 何に使われるか</text>
<path d="M560,194 q14,0 14,14 L574,376.0 q0,14 14,14 q-14,0 -14,14 L574,572 q0,14 -14,14" fill="none" stroke="#66758b" stroke-width="2"/>
<text x="604" y="270.0" font-size="17" fill="#22324a">立てた問いに共通する関心は何か.</text>
<text x="604" y="298.0" font-size="17" fill="#22324a">問いはどこへ向かっているか.</text>
<rect x="604" y="340.0" width="320" height="92" rx="8" fill="#fbeceb" stroke="#c8312b" stroke-width="2"/>
<text x="620" y="366.0" font-size="14" fill="#c8312b" font-weight="bold">教員の場合の答え</text>
<text x="620" y="392.0" font-size="17" fill="#22324a">社会と人間の背後にあるシステムを</text>
<text x="620" y="418.0" font-size="17" fill="#22324a">記述すること</text>
<text x="604" y="480.0" font-size="15" fill="#66758b">別の課題から出発しても, 同じ方向へ</text>
<text x="604" y="502.0" font-size="15" fill="#66758b">向かうかを確かめる</text>
</g></svg>