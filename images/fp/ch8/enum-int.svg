<svg xmlns="http://www.w3.org/2000/svg" width="740" height="535" viewBox="0 0 740 535" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
  <defs>
    <marker id="ah-blue"   markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f6fb2"/></marker>
    <marker id="ah-orange" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="ah-green"  markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e8b57"/></marker>
    <marker id="ah-red"    markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>

  <rect x="0" y="0" width="740" height="535" fill="#ffffff"/>

  <!-- column headers -->
  <g font-size="17" fill="#555" text-anchor="middle">
    <text x="370" y="46">構築子 (<tspan font-family="Menlo,'DejaVu Sans Mono',monospace">Weekday</tspan>)</text>
    <text x="655" y="46" font-family="Menlo,'DejaVu Sans Mono',monospace">Int</text>
  </g>

  <!-- faint per-row connectors (rows 1..6) showing each constructor pairs with an Int -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="448" y1="154" x2="618" y2="154"/>
    <line x1="448" y1="216" x2="618" y2="216"/>
    <line x1="448" y1="278" x2="618" y2="278"/>
    <line x1="448" y1="340" x2="618" y2="340"/>
    <line x1="448" y1="402" x2="618" y2="402"/>
    <line x1="448" y1="464" x2="618" y2="464"/>
  </g>

  <!-- constructor column (monospace) -->
  <g font-family="Menlo,'DejaVu Sans Mono',monospace" font-size="23" fill="#222" text-anchor="middle">
    <text x="370" y="100">Sunday</text>
    <text x="370" y="162">Monday</text>
    <text x="370" y="224">Tuesday</text>
    <text x="370" y="286">Wednesday</text>
    <text x="370" y="348">Thursday</text>
    <text x="370" y="410">Friday</text>
    <text x="370" y="472">Saturday</text>
  </g>

  <!-- integer column (monospace) -->
  <g font-family="Menlo,'DejaVu Sans Mono',monospace" font-size="23" fill="#222" text-anchor="middle">
    <text x="655" y="100">0</text>
    <text x="655" y="162">1</text>
    <text x="655" y="224">2</text>
    <text x="655" y="286">3</text>
    <text x="655" y="348">4</text>
    <text x="655" y="410">5</text>
    <text x="655" y="472">6</text>
  </g>

  <!-- fromEnum / toEnum: the inverse pair, demonstrated on the Sunday <-> 0 row -->
  <line x1="448" y1="82"  x2="620" y2="82"  stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <line x1="620" y1="102" x2="448" y2="102" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah-orange)"/>
  <g font-family="Menlo,'DejaVu Sans Mono',monospace" font-size="16" text-anchor="middle">
    <text x="534" y="73"  fill="#1f6fb2">fromEnum</text>
    <text x="534" y="119" fill="#d97706">toEnum</text>
  </g>

  <!-- succ / pred: vertical move between adjacent constructors (Monday <-> Tuesday gap) -->
  <line x1="270" y1="168" x2="270" y2="202" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <line x1="298" y1="202" x2="298" y2="168" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ah-red)"/>
  <g font-family="Menlo,'DejaVu Sans Mono',monospace" font-size="14">
    <text x="262" y="190" text-anchor="end"   fill="#2e8b57">succ</text>
    <text x="306" y="190" text-anchor="start" fill="#c0392b">pred</text>
  </g>

  <!-- minBound / maxBound callouts -->
  <g font-size="16" fill="#7c3aed" text-anchor="end">
    <text x="305" y="97">minBound →</text>
    <text x="305" y="469">maxBound →</text>
  </g>

  <!-- legend: decode the colors -->
  <g font-family="Menlo,'DejaVu Sans Mono',monospace" font-size="13">
    <line x1="70"  y1="508" x2="92"  y2="508" stroke="#1f6fb2" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="98"  y="512" fill="#1f6fb2">fromEnum</text>
    <line x1="210" y1="508" x2="232" y2="508" stroke="#d97706" stroke-width="3" marker-end="url(#ah-orange)"/>
    <text x="238" y="512" fill="#d97706">toEnum</text>
    <line x1="330" y1="508" x2="352" y2="508" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah-green)"/>
    <text x="358" y="512" fill="#2e8b57">succ</text>
    <line x1="430" y1="508" x2="452" y2="508" stroke="#c0392b" stroke-width="3" marker-end="url(#ah-red)"/>
    <text x="458" y="512" fill="#c0392b">pred</text>
    <line x1="530" y1="508" x2="552" y2="508" stroke="#7c3aed" stroke-width="3"/>
    <text x="558" y="512" fill="#7c3aed">min/maxBound</text>
  </g>
</svg>
