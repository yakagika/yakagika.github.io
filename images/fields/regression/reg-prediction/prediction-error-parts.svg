<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 520" width="1072" height="520" role="img" aria-labelledby="pred-error-title pred-error-desc">
  <title id="pred-error-title">予測誤差の 2 つの部分</title>
  <desc id="pred-error-desc">紺の破線は母集団の回帰直線, 赤の実線は標本から求めた直線です. x₀ では, 赤い菱形が予測値 ŷ(x₀), 紺の丸が母集団の平均 m(x₀), 橙の丸が新しい個体の値 Y₀ です. 予測値から母集団の平均までの差が平均の推定の誤差, 母集団の平均から新しい個体の値までの差が個体差 ε₀ で, この 2 つの和が予測誤差です.</desc>
  <defs>
    <marker id="pred-error-axis-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1072" height="520" fill="#ffffff"/>
  <g fill="none" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="6 6">
    <path d="M432 64 V428"/>
    <path d="M448 80 H564 M448 204 H564 M448 276 H564 M588 80 H868 M588 276 H868"/>
  </g>
  <g fill="none" stroke="#4472c4" stroke-width="4">
    <path d="M64 428 V44" marker-end="url(#pred-error-axis-arrow)"/>
    <path d="M64 428 H568" marker-end="url(#pred-error-axis-arrow)"/>
    <path d="M432 420 V436"/>
  </g>
  <line x1="80" y1="336" x2="560" y2="156" stroke="#1f3864" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 10"/>
  <line x1="80" y1="364" x2="560" y2="244" stroke="#e0262b" stroke-width="5" stroke-linecap="round"/>
  <g fill="#e0262b" fill-opacity="0.36" stroke="#ffffff" stroke-width="2">
    <circle cx="112" cy="384" r="8"/>
    <circle cx="144" cy="372" r="8"/>
    <circle cx="192" cy="312" r="8"/>
    <circle cx="240" cy="296" r="8"/>
    <circle cx="272" cy="288" r="8"/>
    <circle cx="320" cy="280" r="8"/>
    <circle cx="368" cy="316" r="8"/>
    <circle cx="400" cy="312" r="8"/>
  </g>
  <path d="M432 264 L444 276 L432 288 L420 276 Z" fill="#ffffff" stroke="#e0262b" stroke-width="4"/>
  <circle cx="432" cy="204" r="9" fill="#ffffff" stroke="#1f3864" stroke-width="4"/>
  <circle cx="432" cy="80" r="10" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
  <g fill="none" stroke="#1f3864" stroke-width="3">
    <path d="M564 80 H588 M576 80 V204 M564 204 H588 M576 204 V276 M564 276 H588"/>
    <path d="M868 80 H892 M880 80 V276 M868 276 H892"/>
  </g>
  <g font-family="Times, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#000">
    <text x="40" y="72"><tspan font-style="italic">y</tspan></text>
    <text x="552" y="468"><tspan font-style="italic">x</tspan></text>
    <text x="432" y="468" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">0</tspan></text>
    <text x="404" y="88" text-anchor="end"><tspan font-style="italic">Y</tspan><tspan font-size="24" dy="8">0</tspan></text>
    <text x="404" y="200" text-anchor="end"><tspan font-style="italic">m</tspan>(<tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">0</tspan><tspan dy="-8">)</tspan></text>
    <text x="404" y="272" text-anchor="end"><tspan font-style="italic">ŷ</tspan>(<tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">0</tspan><tspan dy="-8">)</tspan></text>
  </g>
  <g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#000">
    <text x="600" y="152">個体差</text>
    <text x="708" y="152" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">ε</tspan><tspan font-size="24" dy="8">0</tspan></text>
    <text x="600" y="252">平均の推定の誤差</text>
    <text x="904" y="188">予測誤差</text>
  </g>
</svg>
