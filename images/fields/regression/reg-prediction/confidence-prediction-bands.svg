<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 548" width="1072" height="548" role="img" aria-labelledby="pred-bands-title pred-bands-desc">
  <title id="pred-bands-title">平均の信頼区間と個人の予測区間</title>
  <desc id="pred-bands-desc">赤い点は 1 つの標本, 赤い直線はその標本から最小二乗法で求めた回帰直線です. 濃い青の帯が母集団の平均の 95% 信頼区間, 破線で縁取った淡い青の帯が新しい個体の 95% 予測区間です. どちらも回帰直線を中心とし, 説明変数の標本平均 x̄ で最も狭く, そこから離れるほど広がります.</desc>
