<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 664" width="1280" height="664" role="img" aria-labelledby="split-cv-title split-cv-desc">
  <title id="split-cv-title">データの分割と k 分割交差検証</title>
  <desc id="split-cv-desc">上段では, 訓練データで候補ごとに係数を求め, 検証データの予測誤差を比べて使う変数や項を選び, テストデータで選んだ式の予測誤差を最後に 1 回だけ測ります. 下段では, テストデータを先に取り分け, 残りを 5 組に分けます. 候補の式ごとに, 4 組で係数を求めて残る 1 組で予測誤差を測ることを, 検証用の組を入れ替えて 5 回繰り返します. 得られた 5 つの誤差の平均で候補の式を比べます.</desc>
  <rect x="0" y="0" width="1280" height="664" fill="#ffffff"/>
  <rect x="40" y="40" width="544" height="64" fill="#e0262b" fill-opacity="0.16"/>
  <rect x="584" y="40" width="328" height="64" fill="#ed7d31" fill-opacity="0.31"/>
  <rect x="912" y="40" width="328" height="64" fill="#9aa3ad" fill-opacity="0.24"/>
  <path d="M584 40 V104 M912 40 V104" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="912" y="220" width="328" height="76" fill="#9aa3ad" fill-opacity="0.24"/>
  <g fill="#e0262b" fill-opacity="0.16" stroke="#e0262b" stroke-opacity="0.48" stroke-width="2">
    <rect x="40" y="320" width="720" height="48"/>
    <rect x="40" y="384" width="720" height="48"/>
    <rect x="40" y="448" width="720" height="48"/>
    <rect x="40" y="512" width="720" height="48"/>
    <rect x="40" y="576" width="720" height="48"/>
  </g>
  <path d="M184 320 V368 M328 320 V368 M472 320 V368 M616 320 V368
           M184 384 V432 M328 384 V432 M472 384 V432 M616 384 V432
           M184 448 V496 M328 448 V496 M472 448 V496 M616 448 V496
           M184 512 V560 M328 512 V560 M472 512 V560 M616 512 V560
           M184 576 V624 M328 576 V624 M472 576 V624 M616 576 V624"
        fill="none" stroke="#e0262b" stroke-opacity="0.48" stroke-width="2"/>
  <path d="M40 320 H184 V368 H40 Z M184 384 H328 V432 H184 Z M328 448 H472 V496 H328 Z
           M472 512 H616 V560 H472 Z M616 576 H760 V624 H616 Z" fill="#ffffff"/>
  <path d="M40 320 H184 V368 H40 Z M184 384 H328 V432 H184 Z M328 448 H472 V496 H328 Z
           M472 512 H616 V560 H472 Z M616 576 H760 V624 H616 Z"
        fill="#ed7d31" fill-opacity="0.31" stroke="#ed7d31" stroke-width="3"/>
  <path d="M904 344 H916 V600 H904" fill="none" stroke="#4472c4" stroke-width="3"/>
  <g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#000">
    <g text-anchor="middle">
      <text x="312" y="84">訓練データ</text>
      <text x="748" y="84">検証データ</text>
      <text x="1076" y="84">テストデータ</text>
      <g font-size="28">
        <text x="312" y="144">候補ごとに係数を求める</text>
        <text x="748" y="144">予測誤差を比べて</text>
        <text x="748" y="180">使う変数や項を選ぶ</text>
        <text x="1076" y="144">選んだ式の予測誤差を</text>
        <text x="1076" y="180">最後に 1 回だけ測る</text>
      </g>
      <text x="1076" y="252">テストデータ</text>
      <text x="1076" y="284" font-size="28">(取り分けておく)</text>
    </g>
    <text x="40" y="280" font-size="36"><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">k</tspan> 分割交差検証 <tspan font-family="Times, 'Times New Roman', serif">(<tspan font-style="italic">k</tspan> = 5)</tspan></text>
    <text x="792" y="356">誤差 1</text>
    <text x="792" y="420">誤差 2</text>
    <text x="792" y="484">誤差 3</text>
    <text x="792" y="548">誤差 4</text>
    <text x="792" y="612">誤差 5</text>
    <text x="944" y="464">5 つの誤差の平均で</text>
    <text x="944" y="504">候補の式を比べる</text>
  </g>
</svg>
