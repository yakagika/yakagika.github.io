<title id="samples-title">同じ母集団から取った標本ごとの回帰直線</title>
<desc id="samples-desc">左は母集団の点と母集団の回帰直線 (破線). 右は同じ母集団から取った 3 つの標本で, 各標本の点と, その点から求めた回帰直線 (赤の実線) を描く. 破線は母集団の回帰直線. 標本ごとに直線の傾きと切片が異なる.</desc>
