<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 800" width="1072" height="800" role="img" aria-labelledby="purpose-pred-title purpose-pred-desc">
<title id="purpose-pred-title">新しい個体の値と予測誤差</title>
<desc id="purpose-pred-desc">標本の赤い点から回帰直線を求め, 説明変数の値 x₀ に対応する直線上の白い菱形を予測値とする. 同じ縦の破線にある疑問符は, 新しい個体のまだ分からない Y₀ を表す. 回帰式を求めるときに使わなかった橙の点と直線との縦の差で, 予測の外れの大きさを測る.</desc>
<defs>
  <marker id="purpose-pred-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-pred-arrow-accent" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L16 8 L0 16 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-pred-arrow-link" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#9aa3ad"/>
  </marker>
</defs>
<rect x="0" y="0" width="1072" height="800" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
<g id="purpose-pred-sampling-arrows">
