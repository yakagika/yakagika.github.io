<text x="768" y="624" font-size="28" text-anchor="middle" fill="#000" font-family="Times, 'Times New Roman', serif"><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">x</tspan><tspan font-family="Times, 'Times New Roman', serif" font-size="24" dy="8">0</tspan></text>
<text x="804" y="372" font-size="28" text-anchor="start" fill="#000">予測値 <tspan font-family="Times, 'Times New Roman', serif" font-style="italic">ŷ</tspan><tspan font-family="Times, 'Times New Roman', serif">(</tspan><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">x</tspan><tspan font-family="Times, 'Times New Roman', serif" font-size="24" dy="8">0</tspan><tspan font-family="Times, 'Times New Roman', serif" dy="-8">)</tspan></text>
<text x="804" y="216" font-size="28" text-anchor="start" fill="#000">新しい個体の <tspan font-family="Times, 'Times New Roman', serif" font-style="italic">Y</tspan><tspan font-family="Times, 'Times New Roman', serif" font-size="24" dy="8">0</tspan></text>
<circle cx="416" cy="680" r="8" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
