<path d="M92 476 H140 L116 512 Z" fill="#4472c4"/>
<path d="M128 472 H236 Q252 472 252 488 V508" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#purpose-pred-arrow-accent)"/>
<path d="M320 176 H328 Q344 176 344 192 V640 Q344 656 328 656 H208" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#purpose-pred-arrow)"/>
</g>
<g id="purpose-pred-population-and-sample">
<circle cx="188" cy="176" r="132" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
<circle cx="132" cy="264" r="24" fill="#ffffff" stroke="#4472c4" stroke-width="3"/>
<text x="188" y="188" font-size="36" text-anchor="middle" fill="#000">母集団</text>
<text x="188" y="352" font-size="28" text-anchor="middle" fill="#000">全体は手に入らない</text>
<rect x="144" y="424" width="128" height="40" fill="#ffffff"/>
<text x="144" y="456" font-size="32" text-anchor="start" fill="#2f5597">標本抽出</text>
<circle cx="116" cy="548" r="28" fill="#e0262b"/>
<text x="116" y="616" font-size="32" text-anchor="middle" fill="#000">標本</text>
<circle cx="252" cy="548" r="28" fill="#ed7d31"/>
<text x="252" y="608" font-size="28" text-anchor="middle" fill="#000">未使用の</text>
<text x="252" y="644" font-size="28" text-anchor="middle" fill="#000">データ</text>
<circle cx="188" cy="656" r="8" fill="#4472c4"/>
<text x="188" y="700" font-size="32" text-anchor="middle" fill="#000">新しい個体</text>
<text x="188" y="728" font-size="28" text-anchor="middle" fill="#000"><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">x</tspan> は分かる,</text>
<text x="188" y="756" font-size="28" text-anchor="middle" fill="#000"><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">y</tspan> はまだ分からない</text>
</g>
<text x="400" y="68" font-size="36" text-anchor="start" fill="#000">知りたいのは: 新しい個体の <tspan font-family="Times, 'Times New Roman', serif" font-style="italic">y</tspan> と,</text>
<text x="400" y="112" font-size="36" text-anchor="start" fill="#000">予測の外れの大きさ</text>
