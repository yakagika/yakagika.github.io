<circle cx="604" cy="160" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<circle cx="640" cy="180" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<circle cx="676" cy="220" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<path d="M724 208 H996" fill="none" stroke="#ed7d31" stroke-width="4"/>
<circle cx="736" cy="212" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="772" cy="192" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="808" cy="220" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="844" cy="180" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="880" cy="220" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="916" cy="188" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="952" cy="216" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="988" cy="236" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<text x="704" y="296" font-size="32" text-anchor="middle" fill="#000">その平均の差 = 平均処置効果</text>
<text x="704" y="336" font-size="28" text-anchor="middle" fill="#000">どちらの場合も, 全体は観測できない</text>
<text x="548" y="500" font-size="36" text-anchor="middle" fill="#000">処置群</text>
<text x="860" y="500" font-size="36" text-anchor="middle" fill="#000">対照群</text>
<path d="M704 480 V636" fill="none" stroke="#9aa3ad" stroke-opacity="0.55" stroke-width="2"/>
<path d="M412 592 H684" fill="none" stroke="#e0262b" stroke-width="4"/>
<circle cx="424" cy="584" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<circle cx="532" cy="572" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<circle cx="568" cy="592" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<circle cx="676" cy="620" r="6" fill="#e0262b" stroke="#ffffff" stroke-width="2"/>
<path d="M724 604 H996" fill="none" stroke="#ed7d31" stroke-width="4"/>
<circle cx="772" cy="592" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="808" cy="620" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="916" cy="588" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<circle cx="952" cy="616" r="6" fill="#ed7d31" stroke="#ffffff" stroke-width="2"/>
<text x="704" y="676" font-size="32" text-anchor="middle" fill="#000">群の平均の差</text>
<text x="704" y="712" font-size="28" text-anchor="middle" fill="#000">各個体は, どちらか一方の場合の</text>
<text x="704" y="744" font-size="28" text-anchor="middle" fill="#000"><tspan font-family="Times, 'Times New Roman', serif" font-style="italic">y</tspan> だけを観測できる</text>
</g>
</svg>
