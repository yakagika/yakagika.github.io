<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 800" width="1072" height="800" role="img" aria-labelledby="purpose-causal-title purpose-causal-desc">
<title id="purpose-causal-title">平均処置効果の推測</title>
<desc id="purpose-causal-desc">母集団の同じ個体について, 全員が処置を受けた場合と全員が受けなかった場合の潜在的結果を並べる. 平均処置効果は, この二つの場合の平均の差である. 標本では各個体の潜在的結果の片方を観測し, 無作為な割り付けや因果の構造の仮定を根拠として平均処置効果を推測する.</desc>
<defs>
  <marker id="purpose-causal-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-causal-arrow-accent" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L16 8 L0 16 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-causal-arrow-link" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#9aa3ad"/>
  </marker>
</defs>
<rect x="0" y="0" width="1072" height="800" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
<g id="purpose-causal-sampling-arrows">
<path d="M156 372 V388 Q156 404 140 404 H132 Q116 404 116 420 V480" fill="none" stroke="#4472c4" stroke-width="24"/>
<path d="M92 476 H140 L116 512 Z" fill="#4472c4"/>
</g>
<g id="purpose-causal-population-and-sample">
<circle cx="188" cy="176" r="132" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
<circle cx="132" cy="264" r="24" fill="#ffffff" stroke="#4472c4" stroke-width="3"/>
<text x="188" y="188" font-size="36" text-anchor="middle" fill="#000">母集団</text>
<text x="188" y="352" font-size="28" text-anchor="middle" fill="#000">全体は手に入らない</text>
<rect x="144" y="424" width="128" height="40" fill="#ffffff"/>
<text x="144" y="456" font-size="32" text-anchor="start" fill="#2f5597">標本抽出</text>
<circle cx="116" cy="548" r="28" fill="#e0262b"/>
<text x="116" y="616" font-size="32" text-anchor="middle" fill="#000">標本</text>
<text x="116" y="656" font-size="28" text-anchor="middle" fill="#000">手に入る</text>
</g>
<g id="purpose-causal-inference">
<path d="M620 368 L648 400 H632 V432 H608 V400 H592 Z" fill="#4472c4"/>
<rect x="500" y="384" width="80" height="40" fill="#ffffff"/>
<text x="572" y="416" font-size="32" text-anchor="end" fill="#2f5597">推測</text>
<rect x="660" y="372" width="356" height="64" fill="#ffffff"/>
<text x="668" y="396" font-size="28" text-anchor="start" fill="#000">無作為な割り付け, または</text>
<text x="668" y="432" font-size="28" text-anchor="start" fill="#000">因果の構造の仮定</text>
</g>
<rect x="376" y="40" width="656" height="312" fill="#f4f7fc" stroke="#4472c4" stroke-width="3" rx="16" id="purpose-causal-population-panel"/>
<rect x="376" y="448" width="656" height="312" fill="#ffffff" stroke="#9aa3ad" stroke-opacity="0.55" stroke-width="3" rx="16" id="purpose-causal-sample-panel"/>
<rect x="400" y="60" width="296" height="192" fill="#ffffff" stroke="#9aa3ad" stroke-opacity="0.55" stroke-width="2" rx="12"/>
<rect x="712" y="60" width="296" height="192" fill="#ffffff" stroke="#9aa3ad" stroke-opacity="0.55" stroke-width="2" rx="12"/>
<text x="548" y="96" font-size="28" text-anchor="middle" fill="#000">全員が処置を</text>
<text x="548" y="132" font-size="28" text-anchor="middle" fill="#000">受けた場合</text>
<text x="860" y="96" font-size="28" text-anchor="middle" fill="#000">全員が処置を</text>
<text x="860" y="132" font-size="28" text-anchor="middle" fill="#000">受けなかった場合</text>
