<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" width="960" height="1000" role="img" aria-labelledby="regeq-title regeq-desc">
<title id="regeq-title">回帰式の各部の名前と, 散布図の上の切片と傾き</title>
<desc id="regeq-desc">回帰式 y = β0 + β1 x の y が目的変数, x が説明変数, β0 が切片, β1 が傾きで, β0 と β1 を合わせて回帰係数と呼ぶ. 下の散布図では, 破線の直線が回帰式を表す. 切片 β0 は x が 0 のときの y の値, 傾き β1 は x が 1 変化した際の y の変化量を示す.</desc>
<defs>
<marker id="regeq-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/></marker>
</defs>
