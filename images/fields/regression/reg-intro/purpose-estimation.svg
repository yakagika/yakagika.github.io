<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 800" width="1072" height="800" role="img" aria-labelledby="purpose-est-title purpose-est-desc">
<title id="purpose-est-title">関係の定量化と母集団への推測</title>
<desc id="purpose-est-desc">母集団から標本を取り, 標本回帰式の係数を計算する. 上の紺の破線は母集団の回帰直線, 下の赤い実線は標本から求めた回帰直線を表す. 標本から母数を推測する際に, 信頼区間や検定を用いる.</desc>
<defs>
  <marker id="purpose-est-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-est-arrow-accent" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L16 8 L0 16 Z" fill="#4472c4"/>
  </marker>
  <marker id="purpose-est-arrow-link" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0 L12 6 L0 12 Z" fill="#9aa3ad"/>
  </marker>
</defs>
