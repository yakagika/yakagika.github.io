<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" width="1360" height="640" role="img" aria-labelledby="linlog-title linlog-desc">
<title id="linlog-title">線形重回帰とロジスティック回帰</title>
<desc id="linlog-desc">左は説明変数が 2 つの線形重回帰で, y = β0 + β1 x1 + β2 x2 は x1, x2, y の空間の平面になる. 右はロジスティック回帰で, p(x) = 1 / (1 + exp(-(β0 + β1 x))) は x に対して S 字の曲線になる.</desc>
<defs>
<marker id="linlog-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/></marker>
</defs>
<rect x="0" y="0" width="1360" height="640" fill="#ffffff"/>
