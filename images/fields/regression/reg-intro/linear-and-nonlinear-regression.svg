<text x="316" y="92" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#e0262b" text-anchor="middle">（説明変数が 2 つの場合）</text>
<text x="316" y="152" font-family="Times, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#e0262b" text-anchor="middle">y<tspan font-style="normal" dx="10">=</tspan><tspan dx="10">β</tspan><tspan font-style="normal" font-size="28" dy="10">0</tspan><tspan font-style="normal" dx="10" dy="-10">+</tspan><tspan dx="10">β</tspan><tspan font-style="normal" font-size="28" dy="10">1</tspan><tspan dy="-10">x</tspan><tspan font-style="normal" font-size="28" dy="10">1</tspan><tspan font-style="normal" dx="10" dy="-10">+</tspan><tspan dx="10">β</tspan><tspan font-style="normal" font-size="28" dy="10">2</tspan><tspan dy="-10">x</tspan><tspan font-style="normal" font-size="28" dy="10">2</tspan></text>
