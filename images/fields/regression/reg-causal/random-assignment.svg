  <text x="584" y="108" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">週 1 時間の自習枠</text>
  <text x="584" y="300" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">対照群</text>
