<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 480" width="1072" height="480" role="img" aria-labelledby="random-assignment-title random-assignment-desc">
  <title id="random-assignment-title">自習枠の無作為な割り付け</title>
  <desc id="random-assignment-desc">対象の学生をくじで, 週 1 時間の自習枠を設ける処置群と, ふだんどおり過ごす対照群に分けます. 点の濃さは事前の成績を表し, 図はそれが両群でそろった一例です. 処置群の平均 GPA から対照群の平均 GPA を引いて, 自習枠を設ける介入の平均処置効果を推定します.</desc>
  <defs>
    <marker id="random-assignment-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
    </marker>
  </defs>
