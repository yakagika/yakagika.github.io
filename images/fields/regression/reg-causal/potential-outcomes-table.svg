  <text x="264" y="76" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">勉強時間を</text>
  <text x="264" y="116" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">週 1 時間</text>
  <text x="264" y="156" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">増やしたか</text>
  <text x="500" y="96" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">増やした場合の</text>
  <text x="500" y="136" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">学期末の GPA</text>
  <text x="748" y="96" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">ふだんどおりの</text>
