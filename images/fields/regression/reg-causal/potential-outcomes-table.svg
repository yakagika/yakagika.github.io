  <text x="536" y="556" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">求めたい量は, 各列の全員分の平均 GPA の差 (平均処置効果)</text>
