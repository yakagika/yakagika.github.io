<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 604" width="1072" height="604" role="img" aria-labelledby="potential-outcomes-table-title potential-outcomes-table-desc">
  <title id="potential-outcomes-table-title">勉強時間を増やす介入の潜在的結果</title>
  <desc id="potential-outcomes-table-desc">学期中の勉強時間を週 1 時間増やす場合と, ふだんどおりの場合の学期末の GPA を, 5 人の学生で考えます. 各学生について実際の世界で観測した GPA だけを数値で示し, もう一方の GPA と個人の差を赤い疑問符で示します. 全員が勉強時間を増やした場合の平均 GPA から, 全員がふだんどおりの場合の平均 GPA を引いた値が平均処置効果です.</desc>
