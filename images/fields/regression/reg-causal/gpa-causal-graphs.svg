<svg xmlns="http://www.w3.org/2000/svg" width="960" height="284"
     viewBox="0 0 960 284" role="img" aria-labelledby="gpa-causal-title gpa-causal-desc">
  <title id="gpa-causal-title">アルバイト時間が媒介変数の場合と交絡因子の場合</title>
  <desc id="gpa-causal-desc">両方で勉強時間とアルバイト時間が GPA の原因になり, 媒介では勉強時間がアルバイト時間を変え, 交絡ではアルバイト時間が勉強時間を変える.</desc>
  <defs>
    <marker id="gpa-causal-gray" viewBox="0 0 12 12" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L12 6 L0 11 Z" fill="#66758b"/>
    </marker>
    <marker id="gpa-causal-blue" viewBox="0 0 16 16" markerWidth="16" markerHeight="16"
            refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L16 8 L0 15 Z" fill="#225f99"/>
    </marker>
  </defs>
  <rect width="960" height="284" fill="#fff"/>
  <line x1="480" y1="28" x2="480" y2="256" stroke="#c3cdd9" stroke-width="2"/>
  <g fill="#22324a" text-anchor="middle" font-size="26"
     font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <g transform="translate(0 0)">
    <text x="240" y="44" font-weight="600">(A) 媒介</text>
    <line x1="180" y1="224" x2="312" y2="224" stroke="#66758b" stroke-width="2.5" marker-end="url(#gpa-causal-gray)"/>
    <line x1="272" y1="130" x2="351" y2="192" stroke="#66758b" stroke-width="2.5" marker-end="url(#gpa-causal-gray)"/>
    <line x1="126" y1="192" x2="208" y2="130" stroke="#225f99" stroke-width="4" marker-end="url(#gpa-causal-blue)"/>
    <rect x="128" y="74" width="224" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="240" y="100" dominant-baseline="central">アルバイト時間</text>
    <rect x="26" y="198" width="148" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="100" y="224" dominant-baseline="central">勉強時間</text>
    <rect x="324" y="198" width="104" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="376" y="224" dominant-baseline="central">GPA</text>
    </g>
    <g transform="translate(480 0)">
    <text x="240" y="44" font-weight="600">(B) 交絡</text>
    <line x1="180" y1="224" x2="312" y2="224" stroke="#66758b" stroke-width="2.5" marker-end="url(#gpa-causal-gray)"/>
    <line x1="272" y1="130" x2="351" y2="192" stroke="#66758b" stroke-width="2.5" marker-end="url(#gpa-causal-gray)"/>
    <line x1="208" y1="130" x2="126" y2="192" stroke="#225f99" stroke-width="4" marker-end="url(#gpa-causal-blue)"/>
    <rect x="128" y="74" width="224" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="240" y="100" dominant-baseline="central">アルバイト時間</text>
    <rect x="26" y="198" width="148" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="100" y="224" dominant-baseline="central">勉強時間</text>
    <rect x="324" y="198" width="104" height="52" rx="8" fill="#f7f8fa" stroke="#66758b" stroke-width="2"/>
    <text x="376" y="224" dominant-baseline="central">GPA</text>
    </g>
  </g>
</svg>
