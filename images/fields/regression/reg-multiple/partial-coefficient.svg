  <text x="784" y="588" font-size="28" text-anchor="start">多い</text>
  <text x="220" y="632" font-size="28" text-anchor="start">層の中の傾き (そろえた傾き) <tspan font-family="Times, 'Times New Roman', serif" font-weight="400">=</tspan> 偏回帰係数</text>
  <text x="220" y="676" font-size="28" text-anchor="start">層をまたいだ傾き <tspan font-family="Times, 'Times New Roman', serif" font-weight="400">=</tspan> そろえない単回帰の傾き</text>
</g>
</svg>
