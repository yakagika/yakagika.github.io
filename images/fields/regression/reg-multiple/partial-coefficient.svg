<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 724" width="1072" height="724" role="img" aria-labelledby="partial-coef-title partial-coef-desc">
  <title id="partial-coef-title">偏回帰係数とそろえる条件</title>
  <desc id="partial-coef-desc">奨学生区分が同じ学生を想定し, 横軸を勉強時間, 縦軸を GPA とし, アルバイト時間で 3 つの層に分けた模式図です. アルバイト時間が長い層ほど勉強時間が短い側に集まり, 同じ勉強時間で比べた GPA も低くなります. 色の付いた平行線の傾きは, アルバイト時間をそろえたときの勉強時間の偏回帰係数です. 層をまとめて当てはめた灰色の破線は, アルバイト時間をそろえない単回帰の傾きで, 各層の直線より急です.</desc>
