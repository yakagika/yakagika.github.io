        696.000,143.107 704.000,140.243 712.000,137.537 720.000,134.981 728.000,132.569 736.000,130.295 744.000,128.153 752.000,126.135
        760.000,124.235 768.000,122.449 776.000,120.769 784.000,119.190 792.000,117.708 800.000,116.315 808.000,115.009 816.000,113.783
