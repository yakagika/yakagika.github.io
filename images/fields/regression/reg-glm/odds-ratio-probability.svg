    <text x="100" y="200" font-size="28" text-anchor="end" fill="#000">0.8</text>
    <text x="100" y="296" font-size="28" text-anchor="end" fill="#000">0.6</text>
    <text x="100" y="392" font-size="28" text-anchor="end" fill="#000">0.4</text>
    <text x="100" y="488" font-size="28" text-anchor="end" fill="#000">0.2</text>
    <text x="100" y="584" font-size="28" text-anchor="end" fill="#000">0</text>
    <text x="264" y="468" font-size="28" text-anchor="end" fill="#000">0.20</text>
    <text x="344" y="408" font-size="28" text-anchor="end" fill="#000">0.333</text>
    <text x="584" y="180" font-size="28" text-anchor="end" fill="#000">0.80</text>
    <text x="680" y="128" font-size="28" text-anchor="middle" fill="#000">0.889</text>
    <text x="380" y="460" font-size="32" text-anchor="start" fill="#000">確率の差 13.3 ポイント</text>
    <text x="700" y="180" font-size="32" text-anchor="start" fill="#000">確率の差 8.9 ポイント</text>
    <text x="512" y="328" font-size="32" text-anchor="start" fill="#000">どちらも週 1 時間の差, オッズ比 2</text>
  </g>
</svg>
