  <path d="M496 312 H476 Q468 312 468 320 V412 Q468 420 460 420 H376" fill="none" stroke="#4472c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M744 288 V216 Q744 208 736 208 H696" fill="none" stroke="#4472c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 480.000 H360 V416.000" fill="none" stroke="#4472c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="480" r="8" fill="#4472c4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="360" cy="416" r="8" fill="#4472c4" stroke="#ffffff" stroke-width="2"/>
  <path d="M600 192.000 H680 V149.333" fill="none" stroke="#4472c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="192" r="8" fill="#4472c4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="680" cy="149.333" r="8" fill="#4472c4" stroke="#ffffff" stroke-width="2"/>
  <g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="44" y="68" font-size="32" text-anchor="start" fill="#000" xml:space="preserve">取得確率 <tspan font-style="italic" font-family="Times, 'Times New Roman', serif">p</tspan></text>
    <text x="520" y="672" font-size="32" text-anchor="middle" fill="#000">勉強時間 (週あたり)</text>
    <text x="120" y="620" font-size="28" text-anchor="middle" fill="#000">0</text>
