<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 716" width="1072" height="716" role="img" aria-labelledby="odds-ratio-probability-title odds-ratio-probability-desc">
  <title id="odds-ratio-probability-title">同じオッズ比に対応する確率の差</title>
  <desc id="odds-ratio-probability-desc">赤い曲線は週あたりの勉強時間と取得確率の関係を示す. 2 時間から 3 時間では確率が 0.20 から約 0.333 に, 6 時間から 7 時間では 0.80 から約 0.889 に上がる. どちらもオッズ比は 2 で, 確率の差は順に約 13.3 ポイントと約 8.9 ポイントになる.</desc>
  <rect x="0" y="0" width="1072" height="716" fill="#ffffff"/>
  <!-- 取得確率の補助線と座標軸 -->
  <line x1="120" y1="96" x2="920" y2="96" stroke="#d9d9d9" stroke-width="2"/>
  <line x1="120" y1="192" x2="920" y2="192" stroke="#d9d9d9" stroke-width="2"/>
  <line x1="120" y1="288" x2="920" y2="288" stroke="#d9d9d9" stroke-width="2"/>
  <line x1="120" y1="384" x2="920" y2="384" stroke="#d9d9d9" stroke-width="2"/>
  <line x1="120" y1="480" x2="920" y2="480" stroke="#d9d9d9" stroke-width="2"/>
  <line x1="120" y1="96" x2="120" y2="576" stroke="#1f3864" stroke-width="3"/>
  <line x1="120" y1="576" x2="920" y2="576" stroke="#1f3864" stroke-width="3"/>
  <line x1="120" y1="576" x2="120" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="280" y1="576" x2="280" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="440" y1="576" x2="440" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="600" y1="576" x2="600" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="760" y1="576" x2="760" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="920" y1="576" x2="920" y2="584" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="96" x2="120" y2="96" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="192" x2="120" y2="192" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="288" x2="120" y2="288" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="384" x2="120" y2="384" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="480" x2="120" y2="480" stroke="#1f3864" stroke-width="3"/>
  <line x1="112" y1="576" x2="120" y2="576" stroke="#1f3864" stroke-width="3"/>
  <!-- p(s) = 1 / (1 + exp(−(−4 log 2 + (log 2) s))) -->
  <polyline points="120.000,547.765 128.000,545.865 136.000,543.847 144.000,541.705 152.000,539.431 160.000,537.019 168.000,534.463 176.000,531.757
