      <text x="164" y="336" font-size="36" text-anchor="middle" fill="#000">連続値</text>
      <text x="164" y="368" font-size="28" text-anchor="middle" fill="#000">(負の値もとる)</text>
      <text x="164" y="564" font-size="28" text-anchor="middle" fill="#000">正規分布</text>
      <text x="164" y="612" font-size="28" text-anchor="middle" fill="#000">恒等リンク</text>
      <text font-family="Times, 'Times New Roman', serif" x="164" y="644" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve"><tspan font-style="italic">μ</tspan> = <tspan font-style="italic">η</tspan></text>
      <text x="164" y="684" font-size="32" text-anchor="middle" fill="#000">線形回帰</text>
    </g>
  </g>
