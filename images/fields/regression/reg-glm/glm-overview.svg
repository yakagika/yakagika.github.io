<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="glm-overview-title glm-overview-desc">
  <title id="glm-overview-title">一般化線形モデルの全体像</title>
  <desc id="glm-overview-desc">説明変数から線形予測子を求め, リンク関数の関係から応答の分布の平均を決める. 目的変数が連続値, 二値, 個数, 正の連続値の場合について, 応答の分布とリンク関数の組み合わせを示す. 最下段は一般化線形混合モデルと階層ベイズモデルへのつながりを示す.</desc>
  <defs>
    <marker id="glm-overview-arrow" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#4472c4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>
  <line x1="216" y1="196" x2="256" y2="196" stroke="#4472c4" stroke-width="4" marker-end="url(#glm-overview-arrow)"/>
  <line x1="696" y1="196" x2="736" y2="196" stroke="#4472c4" stroke-width="4" marker-end="url(#glm-overview-arrow)"/>
  <line x1="936" y1="196" x2="976" y2="196" stroke="#4472c4" stroke-width="4" marker-end="url(#glm-overview-arrow)"/>
  <line x1="276" y1="748" x2="308" y2="748" stroke="#4472c4" stroke-width="4" marker-end="url(#glm-overview-arrow)"/>
  <line x1="956" y1="748" x2="988" y2="748" stroke="#4472c4" stroke-width="4" marker-end="url(#glm-overview-arrow)"/>
  <!-- 説明変数から応答の分布まで -->
  <rect x="40" y="40" width="1200" height="64" rx="16" fill="#f4f7fc"/>
  <rect x="40" y="128" width="176" height="136" rx="16" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
  <rect x="256" y="128" width="440" height="136" rx="16" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
  <rect x="736" y="128" width="200" height="136" rx="16" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
  <rect x="976" y="128" width="264" height="136" rx="16" fill="#f4f7fc" stroke="#4472c4" stroke-width="3"/>
  <g font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="640" y="84" font-size="32" text-anchor="middle" fill="#000">一般化線形モデルの 3 つの要素: 応答の分布, 線形予測子, リンク関数</text>
    <text x="128" y="176" font-size="36" text-anchor="middle" fill="#000">説明変数</text>
    <text x="476" y="176" font-size="36" text-anchor="middle" fill="#000">線形予測子</text>
    <text x="836" y="176" font-size="36" text-anchor="middle" fill="#000">リンク関数</text>
    <text x="1108" y="176" font-size="36" text-anchor="middle" fill="#000">応答の分布</text>
    <text font-family="Times, 'Times New Roman', serif" x="128" y="224" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">1</tspan><tspan dy="-8">, …, </tspan><tspan font-style="italic">x</tspan><tspan font-size="24" dy="8" font-style="italic">k</tspan><tspan dy="-8"></tspan></text>
    <text font-family="Times, 'Times New Roman', serif" x="476" y="224" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve"><tspan font-style="italic">η</tspan> = <tspan font-style="italic">β</tspan><tspan font-size="24" dy="8">0</tspan><tspan dy="-8"> + </tspan><tspan font-style="italic">β</tspan><tspan font-size="24" dy="8">1</tspan><tspan dy="-8"></tspan><tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">1</tspan><tspan dy="-8"> + … + </tspan><tspan font-style="italic">β</tspan><tspan font-size="24" dy="8" font-style="italic">k</tspan><tspan dy="-8"> </tspan><tspan font-style="italic">x</tspan><tspan font-size="24" dy="8" font-style="italic">k</tspan><tspan dy="-8"></tspan></text>
    <text font-family="Times, 'Times New Roman', serif" x="836" y="224" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve"><tspan font-style="italic">g</tspan>(<tspan font-style="italic">μ</tspan>) = <tspan font-style="italic">η</tspan></text>
    <text x="1108" y="212" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve">平均 <tspan font-style="italic" font-family="Times, 'Times New Roman', serif">μ</tspan> の分布から</text>
    <text x="1108" y="244" font-size="28" text-anchor="middle" fill="#000" xml:space="preserve"><tspan font-style="italic" font-family="Times, 'Times New Roman', serif">y</tspan> が出る</text>
  </g>
