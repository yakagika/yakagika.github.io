<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 640" width="1072" height="640" role="img" aria-labelledby="stepwise-title stepwise-desc">
  <title id="stepwise-title">AIC を基準にしたステップワイズ法</title>
  <desc id="stepwise-desc">勉強時間だけの式から始めて, 説明変数を一つ加えるか外した候補の AIC を比べます. AIC が下がる候補があれば, AIC が最も小さい式に替え, そこから再び候補を比べます. どの候補でも AIC が下がらなければ, 今の式を選びます.</desc>
  <defs>
    <marker id="stepwise-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1072" height="640" fill="#ffffff"/>
  <path d="M344 124 V172" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#stepwise-arrow)"/>
  <path d="M344 272 V320" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#stepwise-arrow)"/>
  <path d="M524 388 H680" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#stepwise-arrow)"/>
  <path d="M856 332 V228 A8 8 0 0 0 848 220 H608" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#stepwise-arrow)"/>
  <path d="M344 456 V520" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#stepwise-arrow)"/>
  <rect x="564" y="340" width="76" height="36" fill="#ffffff"/>
  <rect x="360" y="468" width="104" height="40" fill="#ffffff"/>
  <rect x="148" y="40" width="392" height="84" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="80" y="172" width="528" height="100" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <path d="M344 320 L524 388 L344 456 L164 388 Z" fill="#f4f7fc" stroke="#4472c4" stroke-width="3" stroke-linejoin="round"/>
  <rect x="680" y="332" width="352" height="112" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="124" y="520" width="440" height="80" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <text x="344" y="92" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">勉強時間だけの式</text>
  <text x="344" y="216" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">説明変数を 1 つ加えた式と</text>
  <text x="344" y="252" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">外した式をすべて比べる</text>
  <text x="344" y="400" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">AIC が下がるか</text>
  <text x="856" y="380" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">AIC が最も小さい</text>
  <text x="856" y="416" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">候補の式に替える</text>
  <text x="344" y="572" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">止めて, 今の式を選ぶ</text>
  <text x="600" y="368" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2f5597" text-anchor="middle">はい</text>
  <text x="412" y="496" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2f5597" text-anchor="middle">いいえ</text>
</svg>
