<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 564" width="1072" height="564" role="img" aria-labelledby="information-criteria-title information-criteria-desc">
  <title id="information-criteria-title">当てはまりと罰則から求める AIC</title>
  <desc id="information-criteria-desc">パラメータの総数が増えるにつれ, 当てはまりの悪さを表す項は下がって平らに近づき, 罰則の項は直線的に増えます. 2 つの項を足した AIC は赤い曲線で, 破線が示す位置で最小になります. 曲線は模式図で, AIC が最小のモデルを選びます.</desc>
