<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 568" width="1280" height="568" role="img" aria-labelledby="select-then-test-title select-then-test-desc">
  <title id="select-then-test-title">変数を選ぶデータと検定するデータ</title>
  <desc id="select-then-test-desc">上段では同じデータで変数を選んでから検定するため, 通常の P 値が小さめに出やすくなります. 下段では初めにデータを分け, 探索用のデータで選んだ変数を確認用のデータで検定します. 探索用と確認用のデータが独立であり, 手法の仮定が成り立つとき, 確認に通常の検定を使えます.</desc>
  <defs>
    <marker id="select-then-test-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4472c4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="568" fill="#ffffff"/>
  <path d="M164 148 H204" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M456 148 H504" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M924 148 H976" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M164 404 H172 A8 8 0 0 0 180 396 V368 A8 8 0 0 1 188 360 H204" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M164 444 H176 A8 8 0 0 1 184 452 V480 A8 8 0 0 0 192 488 H204" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M440 360 H480" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M688 360 H736" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M440 488 H704 A8 8 0 0 0 712 480 V416 A8 8 0 0 1 720 408 H736" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M992 380 H1024" fill="none" stroke="#4472c4" stroke-width="4" marker-end="url(#select-then-test-arrow)"/>
  <path d="M40 228 H1240" fill="none" stroke="#c8ccd2" stroke-width="2"/>
  <rect x="40" y="104" width="124" height="88" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="204" y="104" width="252" height="88" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="504" y="104" width="420" height="88" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="40" y="380" width="124" height="88" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="204" y="320" width="236" height="80" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="204" y="448" width="236" height="80" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="480" y="320" width="208" height="80" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <rect x="736" y="324" width="256" height="112" fill="#f4f7fc" rx="12" stroke="#4472c4" stroke-width="3"/>
  <text x="40" y="72" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="36" fill="#000" text-anchor="start">(A) 同じデータで選んで検定する</text>
  <text x="40" y="280" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="36" fill="#000" text-anchor="start">(B) 探索用と確認用に分ける</text>
  <text x="104" y="160" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">データ</text>
  <text x="332" y="160" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">変数を選ぶ</text>
  <text x="716" y="160" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">選んだ変数を検定する</text>
  <text x="1104" y="144" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#e0262b" text-anchor="middle">P 値が小さめに</text>
  <text x="1104" y="184" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#e0262b" text-anchor="middle">出やすい</text>
  <text x="104" y="436" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">データ</text>
  <text x="324" y="372" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">探索用のデータ</text>
  <text x="324" y="500" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">確認用のデータ</text>
  <text x="584" y="372" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#000" text-anchor="middle">変数を選ぶ</text>
  <text x="864" y="356" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">選んだ変数を</text>
  <text x="864" y="388" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">確認用のデータで</text>
  <text x="864" y="420" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#000" text-anchor="middle">検定する</text>
  <text x="1132" y="356" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2f5597" text-anchor="middle">独立に分け,</text>
  <text x="1132" y="388" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2f5597" text-anchor="middle">仮定を満たせば</text>
  <text x="1132" y="420" font-family="'Hiragino Sans', 'BIZ UDPGothic', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2f5597" text-anchor="middle">通常の P 値</text>
</svg>
