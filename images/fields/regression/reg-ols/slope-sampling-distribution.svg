  <text x="84" y="480" font-size="32" text-anchor="start">母集団の傾き</text>
  <text x="284" y="480" font-size="32" text-anchor="start" font-family="Times, 'Times New Roman', serif" font-weight="400"><tspan font-family="Times, 'Times New Roman', serif" font-weight="400" font-style="italic">β</tspan><tspan font-family="Times, 'Times New Roman', serif" font-weight="400" font-size="24" dy="8">1</tspan></text>
