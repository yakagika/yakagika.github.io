<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 604" width="1280" height="604" role="img" aria-labelledby="slope-sampling-title slope-sampling-desc">
  <title id="slope-sampling-title">傾きの標本分布</title>
  <desc id="slope-sampling-desc">左は母集団の点と母回帰直線です. 中央は説明変数の値を固定して取り直した 3 つの標本で, 赤い標本回帰直線の傾きは標本ごとに異なります. 右は多くの標本で求めた傾きの推定値 β̂₁ の模式的なヒストグラムです. 分布の中心は母集団の傾きで, 広がりを標準誤差で表します.</desc>
