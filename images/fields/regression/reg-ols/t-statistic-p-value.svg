  <title id="t-pvalue-title">t 統計量と P 値</title>
  <desc id="t-pvalue-desc">帰無仮説 H₀: β₁ = 0 のもとで, 傾きの推定値 β̂₁ を標準誤差 SE(β̂₁) で割った t 統計量の分布です. 100 人の単回帰に対応する自由度 98 の t 分布を使い, 観測した値 t_obs は模式的に 2.2 とします. 左右の赤い領域は, 統計量の絶対値が |t_obs| 以上になる部分です. この両側の面積の合計が P 値です.</desc>
