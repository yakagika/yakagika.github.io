<svg xmlns="http://www.w3.org/2000/svg" width="960" height="481" viewBox="0 0 960 481" role="img" aria-labelledby="title">
  <title id="title">カイ二乗分布を介した分布の関係</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="481" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <rect x="25.00" y="22.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="135.00" y="58.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">N</tspan>(<tspan font-style="italic">μ</tspan>, <tspan font-style="italic">σ</tspan>²)</text>
    <rect x="370.00" y="22.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="480.00" y="58.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">Z</tspan> ∼ <tspan font-style="italic">N</tspan>(0,1)</text>
    <rect x="715.00" y="22.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="825.00" y="58.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">Z</tspan>² ∼ <tspan font-style="italic">χ</tspan>²<tspan dy="5" font-size="80%">1</tspan><tspan dy="-5">&#8203;</tspan></text>
    <rect x="25.00" y="149.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="135.00" y="185.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">Ex(1/2)</text>
    <rect x="370.00" y="149.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="480.00" y="185.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">Ga(<tspan font-style="italic">n</tspan>/2, 1/2)</text>
    <rect x="715.00" y="149.00" width="220.00" height="55.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="825.00" y="185.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">χ</tspan>²<tspan dy="5" font-size="80%" font-style="italic">n</tspan><tspan dy="-5">&#8203;</tspan></text>
    <line x1="249.00" y1="50.00" x2="366.00" y2="50.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="307.00" y="40.00" fill="#22324a" font-size="22" text-anchor="middle">標準化</text>
    <line x1="594.00" y1="50.00" x2="711.00" y2="50.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="652.00" y="40.00" fill="#22324a" font-size="22" text-anchor="middle">二乗</text>
    <line x1="249.00" y1="176.00" x2="366.00" y2="176.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="307.00" y="166.00" fill="#22324a" font-size="22" text-anchor="middle">独立な和¹</text>
    <line x1="594.00" y1="176.00" x2="711.00" y2="176.00" stroke="#22324a" stroke-width="2"/>
    <text x="652.00" y="166.00" fill="#22324a" font-size="22" text-anchor="middle">同じ分布</text>
    <line x1="825.00" y1="81.00" x2="825.00" y2="145.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="813.00" y="120.00" fill="#22324a" font-size="22" text-anchor="end">独立な和</text>
    <text x="124.00" y="232.00" fill="#22324a" font-size="22" text-anchor="middle">¹ n が偶数の場合</text>
    <path d="M 939.00 176.00 L 950.00 176.00 L 950.00 423.00" fill="none" stroke="#22324a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="950.00" y1="311.00" x2="941.00" y2="311.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="950.00" y1="423.00" x2="941.00" y2="423.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="715.00" y="273.00" width="220.00" height="75.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="825.00" y="303.50" fill="#22324a" font-size="24" text-anchor="middle">独立な Z と Q</text>
    <text x="825.00" y="334.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">Q ∼ <tspan font-style="italic">χ</tspan>²<tspan dy="5" font-size="80%" font-style="italic">ν</tspan><tspan dy="-5">&#8203;</tspan></text>
    <rect x="715.00" y="385.00" width="220.00" height="75.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="825.00" y="415.50" fill="#22324a" font-size="24" text-anchor="middle">独立な Q₁ と Q₂</text>
    <text x="825.00" y="446.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">Q₁ ∼ <tspan font-style="italic">χ</tspan>²<tspan dy="5" font-size="80%" font-style="italic">m</tspan><tspan dy="-5">&#8203;</tspan>, Q₂ ∼ <tspan font-style="italic">χ</tspan>²<tspan dy="5" font-size="80%" font-style="italic">n</tspan><tspan dy="-5">&#8203;</tspan></text>
    <rect x="370.00" y="273.00" width="220.00" height="75.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="480.00" y="303.50" fill="#22324a" font-size="24" text-anchor="middle">t 分布</text>
    <text x="480.00" y="334.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">T = <tspan font-style="italic">Z</tspan>/√(Q/ν)</text>
    <rect x="370.00" y="385.00" width="220.00" height="75.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="480.00" y="415.50" fill="#22324a" font-size="24" text-anchor="middle">F(m,n)</text>
    <text x="480.00" y="446.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">(Q₁/m)/(Q₂/<tspan font-style="italic">n</tspan>)</text>
    <rect x="25.00" y="273.00" width="220.00" height="75.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="135.00" y="303.50" fill="#22324a" font-size="24" text-anchor="middle">F(1,ν)</text>
    <text x="135.00" y="334.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">T²</text>
    <line x1="711.00" y1="311.00" x2="594.00" y2="311.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="652.00" y="301.00" fill="#22324a" font-size="22" text-anchor="middle">比</text>
    <line x1="711.00" y1="423.00" x2="594.00" y2="423.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="652.00" y="413.00" fill="#22324a" font-size="22" text-anchor="middle">比</text>
    <line x1="366.00" y1="311.00" x2="249.00" y2="311.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="307.00" y="301.00" fill="#22324a" font-size="22" text-anchor="middle">二乗</text>
  </g>
</svg>
