<svg xmlns="http://www.w3.org/2000/svg" width="960" height="411" viewBox="0 0 960 411" role="img" aria-labelledby="title">
  <title id="title">正規標本の平均方向と偏差方向</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="411" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <line x1="260.00" y1="346.00" x2="260.00" y2="44.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="260.00" y1="346.00" x2="664.00" y2="346.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="248.00" y="32.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">(<tspan font-style="italic">X</tspan>₂ − <tspan font-style="italic">μ</tspan>)/<tspan font-style="italic">σ</tspan></text>
    <text x="672.00" y="354.00" fill="#22324a" font-size="24" text-anchor="start" font-family="Times, 'Times New Roman', serif">(<tspan font-style="italic">X</tspan>₁ − <tspan font-style="italic">μ</tspan>)/<tspan font-style="italic">σ</tspan></text>
    <line x1="222.00" y1="384.00" x2="543.00" y2="63.00" stroke="#c3cdd9" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <line x1="118.00" y1="204.00" x2="282.00" y2="368.00" stroke="#c3cdd9" stroke-width="2" stroke-dasharray="8 5"/>
    <line x1="260.00" y1="346.00" x2="151.00" y2="237.00" stroke="#22324a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="260.00" y1="346.00" x2="498.00" y2="252.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="260.00" y1="346.00" x2="427.00" y2="179.00" stroke="#225f99" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430.00" y1="176.00" x2="499.00" y2="245.00" stroke="#ac482b" stroke-width="2" stroke-dasharray="10 5" marker-end="url(#arrow)"/>
    <path d="M 412.00 194.00 L 430.00 212.00 L 448.00 194.00" fill="none" stroke="#22324a" stroke-width="1.7" stroke-linejoin="round"/>
    <circle cx="430.00" cy="176.00" r="4" fill="#22324a" stroke="#22324a" stroke-width="2"/>
    <circle cx="505.00" cy="251.00" r="4" fill="#22324a" stroke="#22324a" stroke-width="2"/>
    <text x="166.00" y="177.00" fill="#22324a" font-size="24" text-anchor="end">偏差方向</text>
    <text x="447.00" y="141.00" fill="#22324a" font-size="24" text-anchor="end">平均方向の成分</text>
    <text x="565.00" y="67.00" fill="#22324a" font-size="24" text-anchor="start">全成分が等しい方向</text>
    <text x="495.00" y="185.00" fill="#22324a" font-size="24" text-anchor="start">偏差の成分</text>
    <text x="526.00" y="248.00" fill="#22324a" font-size="24" text-anchor="start">標準化した標本</text>
  </g>
</svg>
