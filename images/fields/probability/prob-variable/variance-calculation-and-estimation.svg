<svg xmlns="http://www.w3.org/2000/svg" width="960" height="298" viewBox="0 0 960 298" role="img" aria-labelledby="title">
  <title id="title">既知の分布からの分散の計算と未知の母分散の推定</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="298" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <text x="30.00" y="52.00" fill="#22324a" font-size="24" text-anchor="start">既知の分布</text>
    <rect x="30.00" y="66.00" width="305.00" height="68.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="182.00" y="109.00" fill="#22324a" font-size="28" text-anchor="middle">母集団分布</text>
    <line x1="356.00" y1="100.00" x2="631.00" y2="100.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="494.00" y="89.00" fill="#22324a" font-size="24" text-anchor="middle">分散の計算</text>
    <rect x="654.00" y="66.00" width="276.00" height="68.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="745.00" y="109.00" fill="#22324a" font-size="28" text-anchor="middle">母分散</text>
    <text x="858.00" y="109.00" fill="#22324a" font-size="28" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">σ</tspan><tspan font-size="84%" baseline-shift="super">2</tspan></text>
    <text x="30.00" y="197.00" fill="#22324a" font-size="24" text-anchor="start">未知の分布</text>
    <rect x="30.00" y="211.00" width="305.00" height="68.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="182.00" y="254.00" fill="#22324a" font-size="28" text-anchor="middle">手元のデータ</text>
    <line x1="356.00" y1="245.00" x2="631.00" y2="245.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="494.00" y="234.00" fill="#22324a" font-size="24" text-anchor="middle">母分散の推定</text>
    <rect x="654.00" y="211.00" width="276.00" height="68.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="745.00" y="254.00" fill="#22324a" font-size="28" text-anchor="middle">推定値</text>
    <text x="858.00" y="254.00" fill="#22324a" font-size="28" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">u</tspan><tspan font-size="84%" baseline-shift="super">2</tspan></text>
  </g>
</svg>
