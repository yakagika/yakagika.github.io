<svg xmlns="http://www.w3.org/2000/svg" width="960" height="277" viewBox="0 0 960 277" role="img" aria-labelledby="title">
  <title id="title">母集団と標本の間の抽出と推測</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="277" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <rect x="55.00" y="28.00" width="257.00" height="83.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="183.50" y="62.50" fill="#22324a" font-size="24" text-anchor="middle">母集団</text>
    <text x="183.50" y="93.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">森の全頭</text>
