    <text x="776.50" y="93.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">選んだ個体の体重</text>
    <rect x="55.00" y="167.00" width="257.00" height="83.00" fill="#f8e3da" stroke="#22324a" stroke-width="2"/>
    <text x="183.50" y="201.50" fill="#22324a" font-size="24" text-anchor="middle">母集団の特徴</text>
    <text x="183.50" y="232.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">森全体の平均体重</text>
    <rect x="648.00" y="167.00" width="257.00" height="83.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="776.50" y="201.50" fill="#22324a" font-size="24" text-anchor="middle">標本の特徴</text>
    <text x="776.50" y="232.50" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">選んだ個体の平均体重</text>
    <line x1="318.00" y1="70.00" x2="642.00" y2="70.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="480.00" y="57.00" fill="#22324a" font-size="24" text-anchor="middle">標本抽出</text>
