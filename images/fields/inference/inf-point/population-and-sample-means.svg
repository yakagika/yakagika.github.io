<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title">
  <title id="title">母平均と標本平均の対応</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="248" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <rect x="57.00" y="20.00" width="267.00" height="76.00" fill="#fff" stroke="#22324a" stroke-width="2"/>
    <text x="190.50" y="51.00" fill="#22324a" font-size="24" text-anchor="middle">母集団分布</text>
    <text x="190.50" y="82.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">X</tspan></text>
    <line x1="190.50" y1="100.00" x2="190.50" y2="131.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="57.00" y="136.00" width="267.00" height="86.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="190.50" y="172.00" fill="#22324a" font-size="24" text-anchor="middle">母平均</text>
    <text x="190.50" y="203.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">μ</tspan> = E(<tspan font-style="italic">X</tspan>)</text>
    <rect x="636.00" y="20.00" width="267.00" height="76.00" fill="#fff" stroke="#22324a" stroke-width="2"/>
    <text x="769.50" y="51.00" fill="#22324a" font-size="24" text-anchor="middle">標本</text>
    <text x="769.50" y="82.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">X</tspan>₁, …, <tspan font-style="italic">X</tspan><tspan font-style="italic" dy="5" font-size="80%">n</tspan><tspan dy="-5">&#8203;</tspan></text>
    <line x1="769.50" y1="100.00" x2="769.50" y2="131.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="636.00" y="136.00" width="267.00" height="86.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <text x="769.50" y="172.00" fill="#22324a" font-size="24" text-anchor="middle">標本平均</text>
    <text x="769.50" y="203.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic" text-decoration="overline">X</tspan><tspan font-style="italic" dy="5" font-size="80%">n</tspan><tspan dy="-5">&#8203;</tspan> = (<tspan font-style="italic">X</tspan>₁ + ⋯ + <tspan font-style="italic">X</tspan><tspan font-style="italic" dy="5" font-size="80%">n</tspan><tspan dy="-5">&#8203;</tspan>)/<tspan font-style="italic">n</tspan></text>
    <line x1="630.00" y1="179.00" x2="330.00" y2="179.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="480.00" y="166.00" fill="#22324a" font-size="24" text-anchor="middle">母平均を推定</text>
    <text x="480.00" y="207.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif">E(<tspan font-style="italic" text-decoration="overline">X</tspan><tspan font-style="italic" dy="5" font-size="80%">n</tspan><tspan dy="-5">&#8203;</tspan>) = <tspan font-style="italic">μ</tspan></text>
  </g>
</svg>
