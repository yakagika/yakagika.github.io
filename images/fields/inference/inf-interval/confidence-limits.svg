<svg xmlns="http://www.w3.org/2000/svg" width="960" height="178" viewBox="0 0 960 178" role="img" aria-labelledby="title">
  <title id="title">下側信頼限界と上側信頼限界</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#22324a"/>
    </marker>
  </defs>
  <rect width="960" height="178" fill="#fff"/>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, Arial, sans-serif">
    <line x1="44.00" y1="87.00" x2="916.00" y2="87.00" stroke="#22324a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="234.00" y="77.00" width="492.00" height="20.00" fill="#dceaf6" stroke="#22324a" stroke-width="2"/>
    <circle cx="234.00" cy="87.00" r="5" fill="#22324a" stroke="#22324a" stroke-width="2"/>
    <circle cx="726.00" cy="87.00" r="5" fill="#22324a" stroke="#22324a" stroke-width="2"/>
    <text x="480.00" y="58.00" fill="#22324a" font-size="24" text-anchor="middle">信頼区間</text>
    <text x="234.00" y="129.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">L</tspan></text>
    <text x="234.00" y="159.00" fill="#22324a" font-size="24" text-anchor="middle">下側信頼限界</text>
    <text x="726.00" y="129.00" fill="#22324a" font-size="24" text-anchor="middle" font-family="Times, 'Times New Roman', serif"><tspan font-style="italic">U</tspan></text>
    <text x="726.00" y="159.00" fill="#22324a" font-size="24" text-anchor="middle">上側信頼限界</text>
  </g>
</svg>
