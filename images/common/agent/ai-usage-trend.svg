<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" font-family="Hiragino Kaku Gothic ProN, Hiragino Sans, Noto Sans JP, sans-serif">
<rect width="1320" height="500" fill="#ffffff"/>
<line x1="24" y1="40" x2="1260" y2="40" stroke="#1f6f8b" stroke-width="10"/>
<polygon points="1260,22 1300,40 1260,58" fill="#1f6f8b"/>
<rect x="24" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="122.0" y="142" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">① プロンプト</text>
<text x="122.0" y="166" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">エンジニアリング</text>
<text x="122.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2022〜2023 年頃</text>
<rect x="24" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="38" y="250" font-size="16" fill="#1a1a1a">入力文の書き方を</text>
<text x="38" y="284" font-size="16" fill="#1a1a1a">工夫して出力の</text>
<text x="38" y="318" font-size="16" fill="#1a1a1a">質を上げる</text>
<text x="38" y="352" font-size="16" fill="#1a1a1a">例を示す (few-shot)</text>
<text x="38" y="398" font-size="16" fill="#1a1a1a">考えの過程を書かせる</text>
<text x="38" y="432" font-size="16" fill="#1a1a1a">役割を指定する</text>
<polygon points="222,148 236,156 222,164" fill="#1f6f8b"/>
<rect x="240" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="338.0" y="142" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">② RAG と</text>
<text x="338.0" y="166" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">ツール連携</text>
<text x="338.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2023 年頃</text>
<rect x="240" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="254" y="250" font-size="16" fill="#1a1a1a">知識の古さと</text>
<text x="254" y="284" font-size="16" fill="#1a1a1a">誤りを補うため,</text>
<text x="254" y="318" font-size="16" fill="#1a1a1a">外部の文書や</text>
<text x="254" y="352" font-size="16" fill="#1a1a1a">API とつなぐ</text>
<text x="254" y="398" font-size="16" fill="#1a1a1a">文書を検索して</text>
<text x="254" y="432" font-size="16" fill="#1a1a1a">答えに使う (RAG)</text>
<polygon points="438,148 452,156 438,164" fill="#1f6f8b"/>
<rect x="456" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="554.0" y="154" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">③ エージェント</text>
<text x="554.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2023〜2024 年</text>
<rect x="456" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="470" y="250" font-size="16" fill="#1a1a1a">LLM が自分で</text>
<text x="470" y="284" font-size="16" fill="#1a1a1a">道具を呼び出し,</text>
<text x="470" y="318" font-size="16" fill="#1a1a1a">複数の段階の</text>
<text x="470" y="352" font-size="16" fill="#1a1a1a">作業を進める</text>
<text x="470" y="398" font-size="16" fill="#1a1a1a">考えて行動する</text>
<text x="470" y="432" font-size="16" fill="#1a1a1a">設計への移行</text>
<polygon points="654,148 668,156 654,164" fill="#1f6f8b"/>
<rect x="672" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="770.0" y="142" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">④ マルチエージェント</text>
<text x="770.0" y="166" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">オーケストレーション</text>
<text x="770.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2024 年</text>
<rect x="672" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="686" y="250" font-size="16" fill="#1a1a1a">複数のエージェントに</text>
<text x="686" y="284" font-size="16" fill="#1a1a1a">分業させ,</text>
<text x="686" y="318" font-size="16" fill="#1a1a1a">司令役がまとめる</text>
<text x="686" y="364" font-size="16" fill="#1a1a1a">作業の分解,</text>
<text x="686" y="398" font-size="16" fill="#1a1a1a">割り当て, 統合の</text>
<text x="686" y="432" font-size="16" fill="#1a1a1a">設計が要になる</text>
<polygon points="870,148 884,156 870,164" fill="#1f6f8b"/>
<rect x="888" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="986.0" y="142" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">⑤ ハーネス</text>
<text x="986.0" y="166" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">エンジニアリング</text>
<text x="986.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2024 年〜</text>
<rect x="888" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="902" y="250" font-size="16" fill="#1a1a1a">エージェントを</text>
<text x="902" y="284" font-size="16" fill="#1a1a1a">制御, 観測, 評価,</text>
<text x="902" y="318" font-size="16" fill="#1a1a1a">改善する仕組みを</text>
<text x="902" y="352" font-size="16" fill="#1a1a1a">設計する</text>
<text x="902" y="398" font-size="16" fill="#1a1a1a">評価基準, 検査,</text>
<text x="902" y="432" font-size="16" fill="#1a1a1a">記録, 改善の循環</text>
<polygon points="1086,148 1100,156 1086,164" fill="#1f6f8b"/>
<rect x="1104" y="110" width="196" height="92" rx="10" fill="#1f6f8b"/>
<text x="1202.0" y="142" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">⑥ ループ</text>
<text x="1202.0" y="166" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">エンジニアリング</text>
<text x="1202.0" y="190" font-size="15" fill="#dff0f6" text-anchor="middle">2026 年〜</text>
<rect x="1104" y="214" width="196" height="238" rx="10" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="2"/>
<text x="1118" y="250" font-size="16" fill="#1a1a1a">人が指示を</text>
<text x="1118" y="284" font-size="16" fill="#1a1a1a">打ち続けるのをやめ,</text>
<text x="1118" y="318" font-size="16" fill="#1a1a1a">仕事を見つけ, 実行し,</text>
<text x="1118" y="352" font-size="16" fill="#1a1a1a">検証し, 記憶する</text>
<text x="1118" y="398" font-size="16" fill="#1a1a1a">ループそのものを</text>
<text x="1118" y="432" font-size="16" fill="#1a1a1a">設計し監督する</text>
<line x1="237" y1="64" x2="237" y2="486" stroke="#d62728" stroke-width="3" stroke-dasharray="9 7"/>
<text x="249" y="86" font-size="17" fill="#d62728" font-weight="bold">ここから先を使いこなしている人は少ない</text>
</svg>