title: データサイエンス実践
description: 文系学部生向けに, 分析設計, 可視化, 回帰, 分類, クラスタリング, ニューラルネットワーク, 画像認識, 自然言語処理を Python で実習する講義. 回ごとに共通の例題データで手法を試し, 総合実習では, クラスタリング, 自然言語処理, 画像認識の 3 つから題材を 1 つ選び, 最終回に発表する. (作成中)
open: true
sessions:
  - title: 本資料の読み方
    materials: [guide]
    blocks: []
  - title: "分析設計: データ分析の進め方"
    materials: [scope]
    blocks:
      - block: design-process
        level: required
  - title: データの可視化
    intro: |-
      この回の [Exercise DSP3-3](block:vis-relation#exercise-dsp3-3) の問 1 では, 発展資料の[for 文を利用したグラフ](block:vis-design#for-graph)と[グラフの分割](block:vis-design#グラフの分割)を参照します.
    blocks:
      - block: vis-basic
        level: required
        exercises:
          - id: exercise-dsp3-4
            file: dsp3-4.py
      - block: vis-design
        level: advanced
      - block: vis-distribution
        level: required
        exercises:
          - id: exercise-dsp3-5
            file: dsp3-5.py
      - block: vis-relation
        level: required
        exercises:
          - id: exercise-dsp3-3
            file: dsp3-3.py
      - block: vis-more
        level: advanced
      - block: vis-reading
        level: required
        exercises:
          - id: exercise-dsp3-1
            file: dsp3-1.py
          - id: exercise-dsp3-2
            file: dsp3-2.py
    pages: [[vis-basic], [vis-distribution], [vis-relation, vis-reading]]
  - title: データの数値化
    intro: |-
      この回では対照実験を扱いません. 不偏分散の意味は統計学の講義で扱います.
    blocks:
      - block: num-summary
        level: required
        exercises:
          - id: exercise-dsp4-1
            file: dsp4-1.py
      - block: num-correlation
        level: required
        exercises:
          - id: exercise-dsp4-2
            file: dsp4-2.py
      - block: num-partial
        level: advanced
      - block: num-distance
        level: required
  - title: 回帰分析
    intro: |-
      出生率の単回帰と GPA の重回帰を使って, 関係の定量化と母集団への推測を学びます.
      新しい学生の GPA の予測誤差を測り, 介入する場合としない場合の平均の差を求めるための条件を考えます.

      モデル選択の授業では[目的ごとの変数の選び方](block:reg-selection#model-selection),
      [すべての変数を入れて P 値で比べることの問題](block:reg-selection#all-variables-p-values),
      [情報量規準](block:reg-selection#information-criteria),
      [ステップワイズ法](block:reg-selection#stepwise)を扱います.
      [その他の手法の問題と使いどころ](block:reg-selection-more#other-methods),
      [学問分野ごとの手法の違いと経緯](block:reg-selection-more#model-selection-history),
      [選んだ後の推論](block:reg-selection-more#post-selection),
      [さらに学ぶための文献](block:reg-selection-more#further-reading)は自習用です.

      因果推論の推定手法は, 選択資料の[因果推論](block:causal-intro) (作成中) で扱います.
    blocks:
      - block: reg-intro
        level: required
      - block: reg-ols
        level: advanced
      - block: reg-simple
        level: required
        exercises:
          - id: exercise-reg-simple-1
            file: dsp5-1.py
      - block: reg-multiple
        level: required
      - block: reg-gpa
        level: required
      - block: reg-prediction
        level: required
        exercises:
          - id: exercise-reg-prediction-1
      - block: reg-evaluate
        level: required
        exercises:
          - id: exercise-reg-evaluate-1
            file: dsp5-2.py
      - block: reg-causal
        level: required
      - block: reg-selection
        level: required
      - block: reg-selection-gpa
        level: required
      - block: reg-selection-more
        level: advanced
      - block: reg-selection-lab
        level: advanced
      - block: reg-glm
        level: advanced
      - block: reg-logit
        level: advanced
    pages: [[reg-intro, reg-simple], [reg-multiple, reg-gpa], [reg-prediction, reg-evaluate], [reg-causal], [reg-selection], [reg-selection-gpa]]
  - title: 機械学習の枠組みと決定木
