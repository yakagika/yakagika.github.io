  - title: 画像認識
    intro: |-
      この回の年齢識別の実習では, 学生の PC でも一通りの流れを試せるように, 各年代の画像を 200 枚ずつコピーします. 検証や結果の再現のため, 同じ乱数を使ってできるだけ同じ結果が得られるようにします.

      年齢識別のコードは学生の PC で動くように作っています. うまくいかない場合は [Google Colaboratory](/lectures/colab.html) で試してください.
    blocks:
      - block: img-recognition
        level: required
        exercises:
          - id: exercise-dsp11-1
            file: dsp11-1.py
          - id: exercise-dsp11-2
            file: dsp11-2.py
