title: データサイエンス実践 (回帰分析)
description: >-
  データサイエンス実践の第 5 回 (回帰分析) の資料です.
  回帰分析の分野から, 授業で使う教材と発展の教材を読む順に並べています.
sessions:
  - title: 回帰分析
    intro: >-
      出生率の単回帰と GPA の重回帰を使って, 関係の定量化と母集団への推測を学びます.
      新しい学生の GPA の予測誤差を測り, 介入する場合としない場合の平均の差を求めるための条件を考えます.

      モデル選択の授業では[目的ごとの変数の選び方](block:reg-selection#model-selection),
      [すべての変数を入れて P 値で比べることの問題](block:reg-selection#all-variables-p-values),
      [ステップワイズ法](block:reg-selection#stepwise)を扱います.
      [その他の手法の問題と使いどころ](block:reg-selection#other-methods),
      [学問分野ごとの手法の違いと経緯](block:reg-selection#model-selection-history),
      [選んだ後の推論](block:reg-selection#post-selection),
      [さらに学ぶための文献](block:reg-selection#further-reading)は自習用です.

      因果推論の推定手法は, [第 16 章「因果推論」](/lectures/dsp16.html) (作成中の選択の章) で扱います.
    blocks:
      - block: reg-intro
        level: required
      - block: reg-ols
        level: advanced
      - block: reg-simple
        level: required
        exercises:
          - id: exercise-reg-simple-1
            file: dsp5-1.py
      - block: reg-multiple
        level: required
      - block: reg-gpa
        level: required
      - block: reg-prediction
        level: required
        exercises:
          - id: exercise-reg-prediction-1
      - block: reg-evaluate
        level: required
        exercises:
          - id: exercise-reg-evaluate-1
            file: dsp5-2.py
      - block: reg-causal
        level: required
      - block: reg-selection
        level: required
      - block: reg-selection-gpa
        level: required
      - block: reg-selection-lab
        level: advanced
      - block: reg-glm
        level: advanced
      - block: reg-logit
        level: advanced
