title: データサイエンスプロジェクト (旧 特別講義データサイエンス)
description: 学生が自分の問いを立て, LLM を使ってデータサイエンスの研究を行い, 論文にまとめて学会で発表する通年の講義. 問いの立て方, LLM の使い方, 研究計画, 論文と発表を扱い, 分析の技術は参考資料で学ぶ. (作成中)
open: true
sessions:
  - title: 本資料の読み方と, 特別講義との違い
    materials: [guide]
    blocks: []
  - title: 共通資料による準備
    materials: [common]
    blocks: []
  - title: LLM を使った研究の進め方
    materials: [llm]
    blocks: []
  - title: 問いの立て方
    materials: [question]
    blocks: []
  - title: 研究計画
    materials: [plan]
    blocks: []
  - title: 論文と発表 (作成中)
    materials: [writing]
    blocks: []
supplements:
  - id: reference
    title: 参考資料
    intro: |-
      研究で必要になった分析の技術を学ぶための資料です. どの資料を読むかは, 学生ごとの研究の目的に応じて講義の中で決めます. 資料は次の分野に分かれています.

      - [分析設計](/fields/analysis-design/index.html): 目的, データ, 手法を組み合わせて分析を設計する方法.
      - [記述統計](/fields/descriptive/index.html): データを図と数値で要約し, 読み取る方法.
      - [回帰分析](/fields/regression/index.html): 関係の定量化, 母集団への推測, 予測, 因果推論.
      - [機械学習](/fields/machine-learning/index.html): 分類, クラスタリング, パターン発見, ニューラルネットワーク.
      - [深層学習とその応用](/fields/deep-learning/index.html): Transformer, 自然言語処理, 画像認識.
      - [ベイズ統計学](/fields/bayes/index.html): ベイズ統計学による統計モデリング.
      - [因果推論](/fields/causal/index.html) (作成中): 観察データから因果効果を推定する方法. 基本は, 回帰分析の分野の[因果推論とは何か](/fields/regression/reg-causal/index.html)で扱います.
      - [調査データの扱い](/fields/survey/index.html): 質問紙調査, 共分散構造分析, 欠損値補定.
      - [データの取得](/fields/data-acquisition/index.html): API の基礎と, EDINET, X, YouTube からのデータの取得.

      時系列解析と統計的仮説検定は, 分野の資料を準備しています (統計的仮説検定は推測統計の分野に含めます). 研究でこれらの手法が必要になった場合は, 教員に相談してください.
