<article>
  <header class="article-header">
    <a href="$courseUrl$">$courseTitle$</a>
    <h1 class="article-title">$title$</h1>
  </header>
  $body$
  $if(hasBlocks)$
  <h2>この回で読むブロック</h2>
  <ol class="session-blocks">
    $for(blocks)$
    <li>
      <a href="$url$">$label$</a> ($level$ / $kind$)
      $if(draft)$<span class="badge badge-draft">準備中</span>$endif$
      $if(hasExercises)$
      <ul class="session-exercises">
        $for(exercises)$
        <li>
          <a href="$url$">$label$</a>
          $if(file)$ (提出ファイル <code>$file$</code>)$endif$
        </li>
        $endfor$
      </ul>
      $endif$
    </li>
    $endfor$
  </ol>
  $endif$
</article>
