<article>
<header class="article-header">
    <span class="category-badge">$category$</span>
    <h1 class="article-title">$title$</h1>
    $if(description)$<p class="article-description">$description$</p>$endif$
    <div class="article-meta">
        <span class="meta-item">公開: $date$</span>
        <span class="meta-item">更新: $mtime$</span>
    </div>
    <div class="tag-chips">$tags$</div>
</header>

<!-- 上部: カード型の章ナビゲーション -->
$if(hasChapterNavigation)$<nav class="chapter-nav-card">
$partial("templates/chapter-nav-links.html")$</nav>$endif$

$body$

<!-- 下部: カード型の章ナビゲーション -->
$if(hasChapterNavigation)$<nav class="chapter-nav-card">
$partial("templates/chapter-nav-links.html")$</nav>$endif$
</article>
