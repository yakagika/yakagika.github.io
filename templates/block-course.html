<article>
  <header class="article-header">
    <h1 class="article-title">$title$</h1>
    $if(description)$<p class="article-description">$description$</p>$endif$
  </header>
  <ol class="course-sessions">
    $for(sessions)$
    <li><a href="$url$">$label$</a></li>
    $endfor$
  </ol>
</article>
