<ul class="card-grid">
    $for(lectures)$
    <li class="post-card$if(isOpen)$$else$ draft$endif$">
        <div class="pc-top">
            $if(category)$<span class="pc-cat">$category$</span>$endif$
            <span class="pc-date">$date$</span>
            $if(isOpen)$$else$<span class="badge badge-draft">準備中</span>$endif$
        </div>
        $if(isOpen)$
        <a class="pc-title" href="$url$">$title$</a>
        $else$
        <span class="pc-title draft-title">$title$</span>
        $endif$
        $if(description)$<p class="pc-desc">$description$</p>$endif$
        $if(tags)$<div class="pc-tags">$tags$</div>$endif$
    </li>
    $endfor$
</ul>
