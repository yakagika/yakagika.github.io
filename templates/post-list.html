<ul class="post-list">
    $for(posts)$
    <li class="post-row$if(isOpen)$$else$ draft$endif$">
        <div class="pr-side">
            $if(category)$<span class="pr-cat">$category$</span>$endif$
            <span class="pr-date">$date$</span>
            $if(isOpen)$$else$<span class="badge badge-draft">準備中</span>$endif$
        </div>
        <div class="pr-main">
            $if(isOpen)$
            <a class="pr-title" href="$url$">$title$</a>
            $else$
            <span class="pr-title draft-title">$title$</span>
            $endif$
            $if(description)$<p class="pr-desc">$description$</p>$endif$
            $if(tags)$<div class="pc-tags">$tags$</div>$endif$
        </div>
    </li>
    $endfor$
</ul>
