<div id="lecture-toc" data-mode="series">
  <h2>Index</h2>
  <a href="$fieldUrl$"$if(fieldIndexCurrent)$ aria-current="page"$endif$>$fieldTitle$</a>
  <ul class="toc-root">
    $for(fieldBlocks)$
    <li class="toc-item toc-series-item$if(current)$ current-block$else$ no-children$endif$$if(draft)$ draft$endif$">
      <div class="toc-row">
        <span class="toc-toggle">▾</span>
        <a href="$url$">$label$</a>
        $if(draft)$<span class="badge badge-draft">準備中</span>$endif$
      </div>
      $if(current)$
      <ul class="toc-sublist">
        $for(pages)$
        <li class="toc-item toc-series-item$if(current)$ current$else$ no-children$endif$">
          <div class="toc-row">
            <span class="toc-toggle">▾</span>
            <a href="$url$"$if(current)$ aria-current="page"$endif$>$label$</a>
          </div>
          $if(current)$<ul class="toc-sublist"></ul>$endif$
        </li>
        $endfor$
      </ul>
      $endif$
    </li>
    $endfor$
  </ul>
</div>
