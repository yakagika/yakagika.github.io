<article>
  <header class="article-header">
    <a href="$courseUrl$">$courseTitle$</a>
    <a href="$sessionUrl$">$sessionTitle$</a>
    <h1 class="article-title">$title$</h1>
  </header>
  $partial("templates/block-page-cards.html")$
  $sessionIntro$
  $if(hasMaterials)$<ul class="course-materials" aria-label="講義資料">
    $for(materials)$
    <li><a href="$url$">$label$</a></li>
    $endfor$
  </ul>
  $endif$
  <div class="lesson-body">
    $body$
  </div>
  $if(lastInSession)$$partial("templates/block-advanced.html")$$endif$
  $partial("templates/block-page-cards.html")$
</article>
