<article>
  <header class="article-header">
    <h1 class="article-title">$title$</h1>
    $if(description)$<p class="article-description">$description$</p>$endif$
  </header>
  $if(hasPrerequisites)$
  <h2>前提となる他分野のブロック</h2>
  <ul class="field-prerequisites">
    $for(prerequisites)$
    <li>
      <a href="$url$">$label$</a>
      $if(draft)$<span class="badge badge-draft">準備中</span>$endif$
    </li>
    $endfor$
  </ul>
  $endif$
  <ol class="field-blocks">
    $for(blocks)$
    <li>
      <a href="$url$">$label$</a>
      $if(draft)$<span class="badge badge-draft">準備中</span>$endif$
      <ol>
        $for(pages)$
        <li><a href="$url$">$label$</a></li>
        $endfor$
      </ol>
    </li>
    $endfor$
  </ol>
</article>
