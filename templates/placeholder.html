<article class="placeholder">
  <header class="article-header">
    <span class="category-badge">$category$</span>
    <h1 class="article-title">$title$ <span class="badge badge-draft">準備中</span></h1>
    $if(description)$<p class="article-description">$description$</p>$endif$
    $if(date)$<div class="article-meta"><span class="meta-item">公開予定: $date$</span></div>$endif$
  </header>

  $if(hasChapterNavigation)$<nav class="chapter-nav-card">
$partial("templates/chapter-nav-links.html")$  </nav>$endif$

  <section class="placeholder-body">
    <p>この記事は現在準備中です。公開までしばらくお待ちください。</p>
  </section>

  $if(hasChapterNavigation)$<nav class="chapter-nav-card">
$partial("templates/chapter-nav-links.html")$  </nav>$endif$
</article>
