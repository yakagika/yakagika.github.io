<div id="lecture-toc" data-mode="series">
  <h2>Index</h2>
  <a href="$courseUrl$"$if(courseIndexCurrent)$ aria-current="page"$endif$>$courseTitle$</a>
  <ul class="toc-root">
    $for(indexMaterials)$$partial("templates/block-course-index-item.html")$$endfor$
    $for(indexSections)$
    <li class="toc-item toc-series-item$if(currentSection)$ current-block$else$ no-children$endif$$if(current)$ current$endif$">
      <div class="toc-row">
        <span class="toc-toggle">▾</span>
        <a href="$url$"$if(current)$ aria-current="page"$endif$>$label$</a>
      </div>
      $if(currentSection)$
      <ul class="toc-sublist">
        $for(sectionPages)$$partial("templates/block-course-index-item.html")$$endfor$
      </ul>
      $endif$
    </li>
    $endfor$
  </ul>
</div>
