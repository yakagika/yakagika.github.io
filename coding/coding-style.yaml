# 講義コードへの coding-style 導入 (plan lecture-coding-style, 2026-09-30).
# seed haskell-coding-style / python-coding-style の講義 scope を参照型で使う.
schema: 1
repo: haskell-blog
pin: session
profiles:
  - id: haskell-coding-style
    scope: haskell-lecture
    applies_to: lectures/ の教材 md の Haskell コード例と fp-examples/ の Haskell source を追加・変更するとき
  - id: python-coding-style
    scope: python-lecture
    applies_to: lectures/ の教材 md の Python コード例と slds_code/ の Python source を追加・変更するとき
local:
  - local/haskell-lecture.md
  - local/python-lecture.md
exceptions: []
